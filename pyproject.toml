[project]
name = "greenseer"
version = "0.1.0"
description = "Análise econômico-financeira e comparação de projetos de investimento: fluxos de caixa, VPL/TIR/TIRM/RAU, análise marginal, cenários e simulação de Monte Carlo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaime N. M. S." }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "plotly>=5.24",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "kaleido>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "kaleido>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenseer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
